<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>પ્રવેશ પૂછપરછ • ગાંડિવ એકેડેમી</title>
<meta name="theme-color" content="#14225A">
<meta property="og:title" content="ગાંડિવ એકેડેમી • પ્રવેશ પૂછપરછ">
<meta property="og:description" content="ધોરણ 7 થી 12 • સાયન્સ • કોમર્સ • JEE / NEET">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans Gujarati",system-ui,sans-serif;background:#F3F5FB;color:#0F172A;font-size:16px}
  .hero{background:radial-gradient(circle at 50% 0,#22357F,#0B1440 70%);color:#fff;text-align:center;padding:28px 18px 54px}
  .hero img{width:84px;height:84px;border-radius:50%;border:3px solid #F5C542;background:#111}
  .hero h1{margin:10px 0 2px;font-size:26px;font-weight:800;color:#FDE68A}
  .hero p{margin:4px 0;opacity:.9;font-size:14px}
  .wrap{max-width:520px;margin:-38px auto 0;padding:0 14px 40px}
  .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:14px}
  .ref{background:#FEF3C7;color:#92400E;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
  label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
  input{width:100%;height:50px;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 14px;font:inherit;background:#fff}
  input:focus{outline:3px solid #C7D2FE;border-color:#4338CA}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid #CBD5E1;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:#14225A;color:#fff;border-color:#14225A}
  .btn{height:54px;border:0;border-radius:14px;background:#16A34A;color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn.line{background:#fff;color:#14225A;border:1.5px solid #14225A}
  .btn:disabled{opacity:.6}
  .err{color:#DC2626;font-size:14px;min-height:18px;margin:0}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .foot{text-align:center;color:#475569;font-size:13px;margin-top:18px;line-height:1.6}
  .ok{text-align:center} .ok .tick{font-size:56px} .ok h2{margin:6px 0;font-size:22px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="hero"><img src="logo.png" alt="ગાંડિવ એકેડેમી લોગો"><h1>ગાંડિવ એકેડેમી</h1><p id="line"></p><p id="addr"></p></div>
<div class="wrap">
  <form class="card" id="f" novalidate>
    <h2 style="margin:0;font-size:20px">પ્રવેશની પૂછપરછ</h2>
    <div class="ref" id="ref" hidden>🎁 તમારા મિત્રના આમંત્રણથી</div>
    <div><label for="n">વિદ્યાર્થીનું નામ</label><input id="n" autocomplete="name" placeholder="અટક નામ પિતાનું નામ" maxlength="60"></div>
    <div><label for="m">વાલીનો મોબાઇલ નંબર</label><input id="m" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10 આંકડા" maxlength="14"></div>
    <div><span style="font-weight:600;font-size:14px;display:block;margin-bottom:6px">ધોરણ</span><div class="chips" id="std"></div></div>
    <div><label for="s">શાળા</label><input id="s" placeholder="શાળાનું નામ" maxlength="60"></div>
    <div><label for="v">ગામ</label><input id="v" placeholder="ગામ / વિસ્તાર" maxlength="40"></div>
    <div id="srcw"><span style="font-weight:600;font-size:14px;display:block;margin-bottom:6px">ગાંડિવ વિશે ક્યાંથી જાણ થઈ?</span><div class="chips" id="src"></div></div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit" id="go">મોકલો</button>
  </form>
  <div class="foot" id="foot"></div>
</div>
<script type="module">
  import { ACADEMY, PUSH } from "./config.js";
  const $ = s => document.querySelector(s), P = new URLSearchParams(location.search), ref = P.get("r") || "", br = P.get("b") || "", viaQr = P.get("s") === "qr";
  $("#line").textContent = ACADEMY.posterLine || ""; $("#addr").textContent = ACADEMY.address ? "📍 " + ACADEMY.address : "";
  $("#foot").innerHTML = `📞 <a href="tel:${ACADEMY.phone}">${ACADEMY.phone}</a><br>${ACADEMY.name}${ACADEMY.address ? ", " + ACADEMY.address : ""}`;
  if (ref) { $("#ref").hidden = false; $("#srcw").hidden = true; } else if (viaQr) $("#srcw").hidden = true;
  let std = "", src = "";
  const chips = (el, list, set) => { el.innerHTML = list.map(([k, l]) => `<button type="button" class="chip" data-k="${k}">${l}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.onclick = () => { el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); set(b.dataset.k); }); };
  chips($("#std"), ["7", "8", "9", "10", "11 સાયન્સ", "11 કોમર્સ", "12 સાયન્સ", "12 કોમર્સ"].map(s => [s, s]), v => std = v);
  chips($("#src"), [["friend", "મિત્ર દ્વારા"], ["insta", "Instagram"], ["pamph", "પત્રિકા"], ["old", "જૂનો વિદ્યાર્થી"], ["form", "બીજું"]], v => src = v);
  // આભારનું મધુર સંગીત + હળવું vibration
  const thanks = ac => { try { navigator.vibrate && navigator.vibrate([60, 40, 120]); } catch {}
    if (!ac) return;
    [[523, 0], [659, .14], [784, .28], [1047, .42], [784, .7], [1047, .84]].forEach(([f, d], i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + d, len = i >= 4 ? .7 : .45;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + .05);
    }); };
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const n = $("#n").value.trim(), m = $("#m").value.replace(/\D/g, "").slice(-10), err = $("#err");
    err.textContent = "";
    if (n.length < 2) { err.textContent = "વિદ્યાર્થીનું નામ લખો."; $("#n").focus(); return; }
    if (!/^[6-9]\d{9}$/.test(m)) { err.textContent = "વાલીનો 10 આંકડાનો સાચો મોબાઇલ નંબર લખો."; $("#m").focus(); return; }
    if (!std) { err.textContent = "ધોરણ પસંદ કરો."; return; }
    if (!PUSH?.url) { err.textContent = "હાલ ફોર્મ બંધ છે. કૃપા કરી ફોન કરો."; return; }
    const go = $("#go"); go.disabled = true; go.textContent = "મોકલાય છે…";
    let ac = null; try { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume && ac.resume(); } catch {}
    try {
      await fetch(PUSH.url, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "enquiry", b: br, r: ref, n, m, std, sch: $("#s").value.trim(), vil: $("#v").value.trim(), src: ref ? "ref" : viaQr ? "qr" : src || "form", hp: $("#hp").value }) });
      thanks(ac);
      $("#f").outerHTML = `<div class="card ok"><div class="tick">✅</div><h2>આભાર!</h2><p>તમારી પૂછપરછ મળી ગઈ છે. ગાંડિવ એકેડેમીમાંથી ટૂંક સમયમાં તમને ફોન આવશે.</p>
        <a class="btn line" href="tel:${ACADEMY.phone}">📞 હમણાં વાત કરવી હોય તો ફોન કરો</a></div>`;
    } catch { go.disabled = false; go.textContent = "મોકલો"; err.textContent = "નેટ ચાલુ છે કે નહીં તે જુઓ અને ફરી મોકલો."; }
  };
</script>
</body>
</html>
