<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ગાંડિવ એકેડેમી</title>
<meta name="theme-color" content="#14225A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="app.css">
<!-- ઝડપ માટે: બધી કોડ-ફાઇલો એકસાથે ડાઉનલોડ શરૂ -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="modulepreload" href="config.js">
<link rel="modulepreload" href="fb.js">
<link rel="modulepreload" href="core.js">
<link rel="modulepreload" href="auth.js">
<link rel="modulepreload" href="admin.js">
</head>
<body>
<div id="app"><div class="splash"><img src="logo.png" alt="ગાંડિવ એકેડેમીનો લોગો"></div></div>
<script>
  // છેલ્લે જોયેલી સ્ક્રીન તરત બતાવો (કોડ આવે એ પહેલાં જ)
  try { var s = localStorage.getItem("gv_snap"); if (s) { document.getElementById("app").innerHTML = s;
    var r = localStorage.getItem("gv_snap_role"); if (r) document.documentElement.style.setProperty("--role", r); } } catch (e) {}
</script>
<dialog id="modal" aria-modal="true"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
  import { boot } from "./auth.js";
  import "./admin.js";
  boot();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
